[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent"
version = "0.1.0"
description = "Terminal-based AI agent harness: ReAct loop, tool registry, MCP, long-term memory, sub-agents, permissions and monitoring"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "mcp>=2.0",
    "prometheus-client>=0.22,<1",
    "PyMuPDF>=1.25,<2",
]

[project.optional-dependencies]
sandbox = [
    "paramiko>=3,<4",
]
gmail = [
    "mcp>=2.0",
    "google-api-python-client>=2,<3",
    "google-auth>=2,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
    "email-validator>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
