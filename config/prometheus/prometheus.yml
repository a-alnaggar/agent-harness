global:
  # The agent's /metrics is an in-memory snapshot (no I/O), so scraping it
  # every 2s is cheap - and it is the main delay between something happening
  # and it appearing on the dashboard (15s here used to add up to 15s on top
  # of Grafana's own refresh).
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 5s
scrape_configs:
  - job_name: agent
    metrics_path: /metrics
    static_configs:
      - targets: ["agent:8000"]
